<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网访问 · Smart Wiki</title><style>body{margin:0;background:#f4f6fb;color:#172033;font-family:system-ui}.shell{width:min(92%,780px);margin:7vh auto}.card{padding:38px;border-radius:26px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.12)}.head{display:flex;justify-content:space-between;gap:20px}.head h1{margin:8px 0;font-size:34px}.head p,.tips{color:#64748b}.status{height:max-content;padding:7px 11px;color:#167c5a;border-radius:999px;background:#e8fff5;font-size:12px;font-weight:700}.list{display:grid;gap:12px;margin:28px 0}.address{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.address code{overflow-wrap:anywhere;font-size:16px}.address button,.open{padding:10px 15px;border:0;border-radius:9px;color:#fff;background:#4f46e5;cursor:pointer}.qr{display:grid;min-height:230px;margin-top:20px;border-radius:18px;background:#f8fafc;place-items:center}.qr img{width:210px;height:210px}.tips{font-size:13px;line-height:1.8}.open{display:inline-block;text-decoration:none}@media(max-width:600px){.card{padding:24px}.head,.address{flex-direction:column}}</style></head><body><main class="shell"><section class="card"><div class="head"><div><small>SMART WIKI · LAN</small><h1>局域网访问已启用</h1><p>同一 Wi‑Fi 下的手机和电脑可以使用下面的地址。</p></div><span class="status">● 服务器在线</span></div><div id="addresses" class="list">正在获取地址…</div><div id="qr" class="qr"></div><p class="tips">手机与服务器电脑必须连接同一个路由器。二维码由在线服务生成；无法显示时，直接在手机浏览器输入地址。请保持服务器窗口开启。</p><a class="open" href="index.html">在本机打开 Smart Wiki →</a></section></main><script>fetch('/api/network-info').then(r=>r.json()).then(data=>{const list=data.addresses||[];document.querySelector('#addresses').innerHTML=list.length?list.map(url=>`<div class="address"><code>${url}</code><button data-url="${url}">复制地址</button></div>`).join(''):'<div class="address">未检测到局域网 IPv4 地址</div>';const first=list[0];document.querySelector('#qr').innerHTML=first?`<img alt="局域网访问二维码" src="https://quickchart.io/qr?size=420&text=${encodeURIComponent(first)}">`:'请检查网络连接';document.querySelectorAll('[data-url]').forEach(button=>button.onclick=async()=>{await navigator.clipboard.writeText(button.dataset.url);button.textContent='已复制';});}).catch(()=>document.querySelector('#addresses').textContent='服务器信息读取失败，请重新启动 Smart Wiki');</script></body></html>
