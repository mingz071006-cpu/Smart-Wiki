<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>注册 · Smart Wiki</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="advanced-ui.css"></head>
<body class="auth-page"><main class="auth-layout"><section class="auth-intro register-intro"><a class="brand" href="index.html"><span class="brand-mark">S</span><span><strong>Smart Wiki</strong><small>KNOWLEDGE HUB</small></span></a><div><span class="eyebrow">JOIN KNOWLEDGE</span><h1>开启你的<br>知识探索</h1><p>注册账号，开始探索和收藏感兴趣的知识内容。</p></div><small>← <a href="index.html">返回知识库首页</a></small></section><section class="auth-panel"><div class="auth-card"><span class="auth-icon">＋</span><h2>创建账号</h2><p>填写以下信息，加入 Smart Wiki</p><div id="formMessage" class="form-message" hidden></div><form id="registerForm" class="stack-form"><label>昵称<input name="name" placeholder="你的昵称" autocomplete="name" required></label><label>邮箱<input name="email" type="email" placeholder="name@example.com" autocomplete="email" required></label><label>密码<input name="password" type="password" placeholder="至少 6 个字符" autocomplete="new-password" required></label><label>确认密码<input name="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" required></label><button class="submit-button" type="submit">注册</button></form><div class="auth-switch"><span>已经有账号？</span><a href="login.html">返回登录 →</a></div><p class="demo-note">学习演示版：请不要使用真实网站的重要密码。</p></div></section></main><script src="wiki-data.js"></script><script src="auth.js"></script></body></html>
